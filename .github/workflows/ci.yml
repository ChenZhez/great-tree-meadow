name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: fonts
          key: fonts-${{ hashFiles('tools/lib/fonts.mjs') }}
      - run: npm ci
      - run: npm run i18n
      - run: npx prettier --check "src/**/*.{js,css,json}" "tools/**/*.mjs" "tests/**/*.mjs"
      - run: npm run build:dev
      - run: npm run build
      - run: npm run audit
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: build/shots
          if-no-files-found: ignore
